[package]
name = "cargo-remote"
version = "0.1.0"
edition = "2024"
description = "Compile Rust projects on a remote server over SSH, with cached incremental source sync"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt", "io-util", "io-std", "sync", "fs"] }
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"] }
russh-config = "0.58"
blake2 = "0.10"
bytes = "1"
filetime = "0.2"
terminal_size = "0.4"

[profile.release]
lto = true
codegen-units = 1
